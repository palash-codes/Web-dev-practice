<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Css</title>
    <!-- Toh aaj hum sikhne wale hai css jiska use html page ko style karne ke liye
     use kia jata hai aur ye raha ek example <style>
        div {
            color: rgb(255, 13, 0);
            background-color: aqua;
        }
    </style> 
    
    yaha humne style tag ka use karke bola ki <div> ka colour red kardo aur kiuki <div> ke 
        under Hey i am palash likha tha to wo red ho gaya aur jab humne <div> ke under (background-color: aqua;) 
            ka use kia toh div ka background aqua ho gaya matlab Hey iam palash ka background
            aqua ho gaya aur neeche maine (<span> i am jod</span>) likha tha par usme text red
            nahi hua kiuki humne style tag ke under sirf div ko color kia tha span ko nahi
            lekin agar hum chahe toh span ko bhi colour kar sakte hai ,span lagake kuch aise  <style>
        div, span {
            color: rgb(255, 13, 0);
            background-color: aqua;
        }
    </style>
    -->


    <style>
        div,
        span {
            color: rgb(255, 13, 0);
            background-color: aqua;
        }
    </style>
</head>

<body>
    <div> Hey i am palash</div>
    <span> i am jod</span>
</body>
